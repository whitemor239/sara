{# Reusable SearchInput Component #}
<label class="menu-search-label" for="{{ id|default:'menu-search-input' }}">جست‌وجو در منو</label>
<div class="search-input-field{% if size == 'sm' %} search-sm{% endif %}" dir="rtl">
  <span class="search-icon search-magnifier" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </span>
  <span class="search-icon search-spinner" aria-hidden="true" style="display: none;">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
    </svg>
  </span>
  <input
    aria-label="جست‌وجو در منو"
    type="search"
    name="{{ name|default:'q' }}"
    value="{{ value|default:'' }}"
    placeholder="{{ placeholder|default:'جست‌وجوی شیرینی…' }}"
    inputmode="search"
    enterkeyhint="search"
    autocomplete="off"
    class="search-text-input"
    id="{{ id|default:'menu-search-input' }}"
  />
  <button
    type="button"
    class="search-clear-btn"
    aria-label="پاک کردن"
    style="{% if not value %}display: none;{% endif %}"
  >
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
  {% if shortcut %}
    <kbd dir="ltr" class="search-shortcut">{{ shortcut }}</kbd>
  {% endif %}
</div>
