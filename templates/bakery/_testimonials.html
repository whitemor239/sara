{# TestimonialsBlock Component (Converted from React TestimonialsBlock) #}
<section class="testimonials-section section-shell" aria-labelledby="testimonials-heading">
  <div class="testimonials-header text-center" data-reveal>
    <p class="eyebrow">{{ eyebrow|default:"تجربهٔ همراهان ما" }}</p>
    <h2 id="testimonials-heading">{{ title|default:"حرف مشتری‌ها" }}</h2>
  </div>

  <div class="testimonials-grid" data-reveal>
    {% if featured_reviews %}
      {% for review in featured_reviews %}
        <figure class="testimonial-card">
          <div class="rating-stars" role="img" aria-label="امتیاز {{ review.rating }} از ۵">
            {% for _ in "12345" %}
              {% if forloop.counter <= review.rating %}
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="currentColor" stroke-width="1" class="star-icon" aria-hidden="true" focusable="false">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
              {% else %}
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" class="star-icon star-empty" aria-hidden="true" focusable="false">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
              {% endif %}
            {% endfor %}
          </div>
          <blockquote class="testimonial-quote">
            «{{ review.comment }}»
          </blockquote>
          <figcaption class="testimonial-author">
            <div class="testimonial-avatar" aria-hidden="true">{{ review.author_name|slice:":1" }}</div>
            <div class="testimonial-meta">
              <p class="testimonial-name">{{ review.author_name }}</p>
              <p class="testimonial-role">{{ review.product.name }}</p>
            </div>
          </figcaption>
        </figure>
      {% endfor %}
    {% endif %}
  </div>
</section>
