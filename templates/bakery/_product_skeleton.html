{# Product Card Skeleton with RTL Shimmer Effect #}
<article class="product-item skeleton-item" aria-hidden="true">
  <div class="product-photo skeleton-box skeleton-shimmer"></div>
  <div class="product-body" style="padding-top: 0.75rem;">
    <div class="skeleton-box skeleton-shimmer skeleton-line" style="width: 65%; height: 1.1rem; margin-bottom: 0.4rem;"></div>
    <div class="skeleton-box skeleton-shimmer skeleton-line" style="width: 85%; height: 0.8rem;"></div>
    <div class="product-labels" style="margin-top: 0.45rem;">
      <div class="skeleton-box skeleton-shimmer skeleton-pill" style="width: 3.5rem; height: 1.3rem;"></div>
      <div class="skeleton-box skeleton-shimmer skeleton-pill" style="width: 3rem; height: 1.3rem;"></div>
    </div>
    <div class="product-footer">
      <div class="skeleton-box skeleton-shimmer skeleton-line" style="width: 5rem; height: 1.1rem;"></div>
      <div class="skeleton-box skeleton-shimmer skeleton-line" style="width: 6rem; height: 0.7rem;"></div>
      <div class="skeleton-box skeleton-shimmer skeleton-btn" style="width: 100%; height: 2rem; border-radius: 6px;"></div>
    </div>
  </div>
</article>
